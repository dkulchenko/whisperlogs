name: Build Burrito Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: burrito-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-attach:
    name: Build Burrito and Upload Assets
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod

    steps:
      - name: Checkout release ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up BEAM
        uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        with:
          version-type: strict
          otp-version: "29.0.3"
          elixir-version: "1.20.2"

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "26.5.1"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install Burrito system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils p7zip-full

      - name: Cache Elixir deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: burrito-${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            burrito-${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Install frontend dependencies
        run: npm ci --prefix assets

      - name: Install asset toolchains
        run: mix assets.setup

      - name: Build release with Burrito
        run: mix release whisperlogs

      - name: Upload Burrito assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" burrito_out/* --clobber
