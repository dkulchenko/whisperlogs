services:
  whisperlogs:
    build:
      context: .
    image: whisperlogs:latest
    ports:
      - "127.0.0.1:4050:4050"
      # Expose syslog listeners as needed for configured sources:
      # - "5514:5514/tcp"
      # - "5514:5514/udp"
    environment:
      PORT: "4050"
      DATABASE_PATH: /var/lib/whisperlogs/db.sqlite
      WHISPERLOGS_BIND_IP: 0.0.0.0
      PHX_HOST: localhost
      WHISPERLOGS_BOOTSTRAP_ADMIN_EMAIL: local@localhost
      WHISPERLOGS_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/whisperlogs_admin_password
      WHISPERLOGS_EXPORT_ROOT: /var/lib/whisperlogs/exports
      # Required in PostgreSQL mode; SQLite persists one beside the database:
      # SECRET_KEY_BASE: replace-with-strong-random-value
      # Set to use PostgreSQL mode instead of SQLite:
      # DATABASE_URL: postgres://user:password@postgres:5432/whisperlogs
    volumes:
      - whisperlogs_data:/var/lib/whisperlogs
    secrets:
      - whisperlogs_admin_password
    restart: unless-stopped

volumes:
  whisperlogs_data:

secrets:
  whisperlogs_admin_password:
    file: ${WHISPERLOGS_ADMIN_PASSWORD_FILE:-./secrets/whisperlogs_admin_password}
